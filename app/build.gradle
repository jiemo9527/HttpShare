plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jiemo9527.httpshare'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jiemo9527.httpshare'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
