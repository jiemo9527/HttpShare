<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HTTP 共享</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2126;--mut:#6b7380;--line:#e3e6ea;--acc:#0f8a6b;--red:#c62828;--hover:#f0f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#111416;--card:#1a1e21;--fg:#e6e8ea;--mut:#8d96a0;--line:#2a3035;--acc:#35c49a;--red:#ef5350;--hover:#22282c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-left))}
.bar{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap}
.crumbs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px;align-items:center;color:var(--mut)}
.crumbs a{color:var(--acc);text-decoration:none;padding:2px 4px;border-radius:4px;overflow-wrap:anywhere}
.crumbs a:hover{background:var(--hover)}
button,.btn{text-decoration:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left)) 80px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools input[type=search]{flex:1;min-width:140px}
input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1fr 110px 150px 90px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{color:var(--mut);font-size:12px;cursor:default;user-select:none}
.row.head span{cursor:pointer}
.row:not(.head):hover{background:var(--hover)}
.name{overflow-wrap:anywhere;min-width:0}
.name a{color:var(--fg);text-decoration:none}
.name a:hover{color:var(--acc)}
.mut{color:var(--mut);font-size:12px}
.ops{display:flex;gap:4px;justify-content:flex-end;opacity:.75}
.ops button{padding:2px 7px;font-size:12px}
.ic{font-size:18px;text-align:center}
.empty{padding:40px;text-align:center;color:var(--mut)}
.share{display:flex;align-items:center;gap:10px}
.tag{font-size:11px;border:1px solid var(--red);color:var(--red);border-radius:4px;padding:0 4px}
@media (max-width:720px){
 .row{grid-template-columns:28px 1fr auto;row-gap:0}
 .row .c-size,.row .c-time{display:none}
 .row.head .c-ops{display:none}
 .name .sub{display:block}
 .ops{grid-column:2/4;justify-content:flex-start}
}
@media (min-width:721px){.name .sub{display:none}}
#login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
#login input{width:100%;margin:12px 0}
#login button{width:100%}
.err{color:var(--red);min-height:1.5em}
#drop{position:fixed;inset:0;background:rgba(15,138,107,.18);border:3px dashed var(--acc);display:none;align-items:center;justify-content:center;font-size:20px;z-index:20}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:30;max-width:90vw}
#prog{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px;display:none;z-index:10}
#prog .b{height:4px;background:var(--line);border-radius:2px;margin-top:4px}
#prog .b i{display:block;height:100%;background:var(--acc);border-radius:2px;width:0}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:40;flex-direction:column}
#viewer img,#viewer video{max-width:96vw;max-height:86vh}
#viewer .vt{color:#fff;margin-top:8px;max-width:90vw;overflow-wrap:anywhere}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="login" class="hidden">
  <h2 style="margin:0">🔒 需要访问密码</h2>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密码">
  <div class="err" id="lerr"></div>
  <button class="pri" id="lbtn">进入</button>
</div>
<div id="app" class="hidden">
<header><div class="bar">
  <h1>📁 HTTP 共享</h1>
  <div class="crumbs" id="crumbs"></div>
  <a class="btn" href="/showme" title="跟随手机 App 当前打开的目录">同步查阅</a>
  <button id="logout" class="hidden">退出</button>
</div></header>
<main>
  <div class="tools">
    <input type="search" id="filter" placeholder="筛选当前目录…">
    <span id="wtools" class="hidden" style="display:flex;gap:8px">
      <button id="upbtn" class="pri">上传</button>
      <button id="mkbtn">新建文件夹</button>
      <input type="file" id="file" multiple hidden>
    </span>
  </div>
  <div class="list" id="list"></div>
</main>
</div>
<div id="drop">松开以上传到当前目录</div>
<div id="prog"><div id="ptxt"></div><div class="b"><i id="pbar"></i></div></div>
<div id="toast"></div>
<div id="viewer"><div id="vbox"></div><div class="vt" id="vt"></div></div>
<script>
const $=id=>document.getElementById(id);
let info={},cur='',entries=[],sortKey='n',sortAsc=true;
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
async function api(path,opt={}){opt.headers=Object.assign({'X-HS':'1'},opt.headers||{});opt.credentials='same-origin';const r=await fetch(path,opt);let j={};try{j=await r.json()}catch(e){}
 if(r.status===401){showLogin();throw new Error('需要登录')}
 if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function size(n){if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<3);return n.toFixed(n<10?2:1)+' '+u[i]}
function time(t){if(!t)return'';const d=new Date(t),p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function icon(e){if(e.d)return'📁';const x=(e.n.split('.').pop()||'').toLowerCase();
 if(/^(jpe?g|png|gif|webp|bmp|heic|svg)$/.test(x))return'🖼️';if(/^(mp4|mkv|webm|mov|3gp|avi)$/.test(x))return'🎬';
 if(/^(mp3|m4a|flac|wav|ogg|aac|opus|amr)$/.test(x))return'🎵';if(/^(zip|rar|7z|tar|gz|xz)$/.test(x))return'🗜️';if(x==='apk')return'📦';
 if(/^(txt|log|md|json|xml|prop|conf|ini)$/.test(x))return'📄';return'📃'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pw').focus()}
async function login(){$('lerr').textContent='';try{const r=await fetch('/api/login',{method:'POST',body:$('pw').value,credentials:'same-origin'});const j=await r.json();if(!r.ok)throw new Error(j.error);$('pw').value='';boot()}catch(e){$('lerr').textContent=e.message}}
$('lbtn').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.hash='';boot()};
async function boot(){info=await (await fetch('/api/info',{credentials:'same-origin'})).json();
 if(info.auth&&!info.loggedIn)return showLogin();
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 $('logout').classList.toggle('hidden',!info.auth);$('wtools').classList.toggle('hidden',!info.upload);route()}
function route(){cur=decodeURIComponent(location.hash.slice(1)||'');$('filter').value='';cur?loadDir():loadShares()}
window.onhashchange=route;
function crumbs(shareName){const c=$('crumbs');let h='<a href="#">全部共享</a>';if(cur){const s=cur.split('/').filter(Boolean);let acc='';
 s.forEach((p,i)=>{acc+='/'+p;h+=' / <a href="#'+esc(encodeURIComponent(acc))+'">'+esc(i===0?shareName:p)+'</a>'})}c.innerHTML=h}
async function loadShares(){crumbs('');$('wtools').style.visibility='hidden';try{const j=await api('/api/shares');
 $('list').innerHTML=j.shares.length?j.shares.map(s=>'<div class="row"><span class="ic">🗂️</span><div class="name share"><a href="#'+esc(encodeURIComponent('/'+s.i))+'">'+esc(s.name)+'</a>'+(s.root?'<span class="tag">ROOT</span>':'')+'</div></div>').join(''):'<div class="empty">未配置共享目录</div>'}catch(e){toast(e.message)}}
async function loadDir(){$('wtools').style.visibility='visible';$('list').innerHTML='<div class="empty">加载中…</div>';
 try{const j=await api('/api/ls?p='+encodeURIComponent(cur));entries=j.entries;crumbs(j.share);render()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function sortBy(k){if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=k==='n'}render()}
function render(){const f=$('filter').value.toLowerCase();let list=entries.filter(e=>!f||e.n.toLowerCase().includes(f));
 list.sort((a,b)=>{if(a.d!==b.d)return a.d?-1:1;let r=sortKey==='n'?a.n.localeCompare(b.n,'zh',{numeric:true}):(a[sortKey]-b[sortKey]);return sortAsc?r:-r});
 const ar=k=>sortKey===k?(sortAsc?' ▲':' ▼'):'';
 let h='<div class="row head"><span></span><span data-k="n">名称'+ar('n')+'</span><span class="c-size" data-k="s">大小'+ar('s')+'</span><span class="c-time" data-k="t">修改时间'+ar('t')+'</span><span class="c-ops"></span></div>';
 const up=cur.split('/').filter(Boolean);if(up.length>1)h+='<div class="row"><span class="ic">⬆️</span><div class="name"><a href="#'+esc(encodeURIComponent('/'+up.slice(0,-1).join('/')))+'">..</a></div></div>';
 for(const e of list){const p=cur+'/'+e.n;const href=e.d?'#'+esc(encodeURIComponent(p)):'/f'+esc(enc(p));
  h+='<div class="row" data-n="'+esc(e.n)+'"><span class="ic">'+icon(e)+'</span><div class="name"><a href="'+href+'" '+(e.d?'':'data-f="1" target="_blank" rel="noopener"')+'>'+esc(e.n)+'</a>'
  +'<span class="sub mut">'+(e.d?'':size(e.s)+' · ')+time(e.t)+'</span></div><span class="c-size mut">'+(e.d?'':size(e.s))+'</span><span class="c-time mut">'+time(e.t)+'</span><div class="ops">'
  +(e.d?'':'<button data-a="dl">下载</button>')+(info.modify?'<button data-a="mv">改名</button><button data-a="rm" class="danger">删除</button>':'')+'</div></div>'}
 if(!list.length)h+='<div class="empty">空目录</div>';$('list').innerHTML=h}
$('filter').oninput=render;
$('list').onclick=async ev=>{const k=ev.target.dataset.k;if(k)return sortBy(k);
 const a=ev.target.closest('a[data-f]');if(a&&preview(a))return ev.preventDefault();
 const b=ev.target.closest('button');if(!b)return;const n=b.closest('.row').dataset.n;const p=cur+'/'+n;
 if(b.dataset.a==='dl'){location.href='/f'+enc(p)+'?dl=1'}
 else if(b.dataset.a==='rm'){if(!confirm('删除「'+n+'」？目录会连同内容一起删除，不可恢复。'))return;try{await api('/api/rm?p='+encodeURIComponent(p),{method:'POST'});toast('已删除');loadDir()}catch(e){toast(e.message)}}
 else if(b.dataset.a==='mv'){const to=prompt('新名称',n);if(!to||to===n)return;try{await api('/api/mv?p='+encodeURIComponent(p)+'&to='+encodeURIComponent(to),{method:'POST'});loadDir()}catch(e){toast(e.message)}}};
function preview(a){const n=a.textContent,x=(n.split('.').pop()||'').toLowerCase(),src=a.getAttribute('href');let el;
 if(/^(jpe?g|png|gif|webp|bmp)$/.test(x)){el=document.createElement('img')}else if(/^(mp4|webm|mov|m4v)$/.test(x)){el=document.createElement('video');el.controls=true;el.autoplay=true}
 else if(/^(mp3|m4a|flac|wav|ogg|aac|opus)$/.test(x)){el=document.createElement('audio');el.controls=true;el.autoplay=true}else return false;
 el.src=src;const box=$('vbox');box.innerHTML='';box.appendChild(el);$('vt').textContent=n+'（点击空白处关闭）';$('viewer').style.display='flex';return true}
$('viewer').onclick=e=>{if(e.target.tagName==='VIDEO'||e.target.tagName==='AUDIO')return;$('viewer').style.display='none';$('vbox').innerHTML=''};
document.onkeydown=e=>{if(e.key==='Escape')$('viewer').click()};
$('upbtn').onclick=()=>$('file').click();$('file').onchange=e=>{upload([...e.target.files]);e.target.value=''};
$('mkbtn').onclick=async()=>{const n=prompt('文件夹名称');if(!n)return;try{await api('/api/mkdir?p='+encodeURIComponent(cur+'/'+n),{method:'POST'});loadDir()}catch(e){toast(e.message)}};
function put(url,file,onp){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('X-HS','1');x.upload.onprogress=e=>onp(e.loaded);
 x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status===200?ok():no(Object.assign(new Error(j.error||('HTTP '+x.status)),{status:x.status}))};x.onerror=()=>no(new Error('网络错误'));x.send(file)})}
async function upload(files){if(!info.upload||!cur||!files.length)return;const pg=$('prog');pg.style.display='block';const total=files.reduce((s,f)=>s+f.size,0);let done=0,okc=0;
 for(const f of files){const url='/f'+enc(cur+'/'+f.name);const onp=l=>{$('ptxt').textContent='上传 '+f.name+'  '+size(done+l)+' / '+size(total);$('pbar').style.width=(total?(done+l)/total*100:100)+'%'};
  try{await put(url,f,onp);okc++}catch(e){if(e.status===409&&!info.modify){toast(f.name+'：已存在（无覆盖权限）')}else if(e.status===409&&confirm('「'+f.name+'」已存在，覆盖？')){try{await put(url+'?overwrite=1',f,onp);okc++}catch(e2){toast(f.name+': '+e2.message)}}else if(e.status!==409)toast(f.name+': '+e.message)}
  done+=f.size}
 pg.style.display='none';toast('已上传 '+okc+'/'+files.length);loadDir()}
let dc=0;const drop=$('drop');
addEventListener('dragenter',e=>{if(info.upload&&cur&&e.dataTransfer.types.includes('Files')){dc++;drop.style.display='flex'}});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;drop.style.display='none'}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;drop.style.display='none';upload([...e.dataTransfer.files])});
boot().catch(e=>toast(e.message));
</script>
</body>
</html>
